<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turen Dashboard | KOPTANU Hub</title>

    <link rel="manifest" href="manifest.json">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <style>
        /* =====================
           THEME VARIABLES
        ====================== */
        :root {
            /* LIGHT MODE */
            --primary-blue: #2563eb;
            --electric-blue: #38bdf8;

            --bg-main: #e5e7eb;          /* grey background */
            --bg-card: #d1d5db;          /* darker grey cards */
            --bg-card-alt: #cbd5e1;

            --text-main: #1f2937;        /* dark readable text */
            --text-muted: #4b5563;
            --text-strong: #111827;

            --card-shadow: 0 15px 30px rgba(0,0,0,0.15);
            --border-soft: rgba(0,0,0,0.15);
        }

        /* =====================
           DARK MODE
        ====================== */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-main: #1f2933;      /* dark grey background */
                --bg-card: #111827;      /* darker boxes */
                --bg-card-alt: #0f172a;

                --text-main: #e5e7eb;
                --text-muted: #9ca3af;
                --text-strong: #f9fafb;

                --card-shadow: 0 20px 40px rgba(0,0,0,0.6);
                --border-soft: rgba(255,255,255,0.1);
            }
        }

        /* =====================
           BASE
        ====================== */
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-main);
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .progress-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: linear-gradient(to right, var(--primary-blue), var(--electric-blue), var(--primary-blue));
            background-size: 200% auto;
            animation: moveGradient 3s linear infinite;
            z-index: 1000;
        }

        @keyframes moveGradient {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        /* =====================
           INSTALL SCREEN
        ====================== */
        #installOnly {
            display: none;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 40px;
            background: var(--bg-card);
            border-radius: 30px;
            box-shadow: var(--card-shadow);
            max-width: 500px;
        }

        #installOnly i {
            font-size: 4rem;
            color: var(--electric-blue);
        }

        #installOnly h1 {
            font-size: 28px;
            font-weight: 800;
            color: var(--text-strong);
        }

        .install-btn {
            padding: 16px 40px;
            font-size: 18px;
            border-radius: 14px;
            border: none;
            background: linear-gradient(45deg, var(--primary-blue), var(--electric-blue));
            color: white;
            cursor: pointer;
            font-weight: 700;
            margin-top: 20px;
        }

        /* =====================
           APP CONTENT
        ====================== */
        #appContent {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            padding: 60px 20px;
        }

        .title-container {
            text-align: center;
            margin-bottom: 50px;
        }

        .title {
            font-size: 3rem;
            font-weight: 800;
            color: var(--text-strong);
        }

        .subtitle {
            letter-spacing: 4px;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
        }

        /* =====================
           MENU
        ====================== */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            width: 100%;
            max-width: 1100px;
        }

        .menu-card {
            background: var(--bg-card);
            padding: 30px;
            border-radius: 25px;
            text-decoration: none;
            color: var(--text-main);
            box-shadow: var(--card-shadow);
            border: 1px solid var(--border-soft);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            transition: transform 0.25s ease;
        }

        .menu-card:hover {
            transform: translateY(-6px);
        }

        .counter {
            position: absolute;
            top: 18px;
            right: 22px;
            font-weight: 800;
            color: var(--primary-blue);
            opacity: 0.7;
        }

        .javanese {
            font-size: 1.3rem;
            color: var(--text-muted);
            font-weight: 300;
        }

        .menu-card i {
            font-size: 3rem;
            margin: 15px 0;
            color: var(--primary-blue);
        }

        .latin {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-strong);
        }

        @media (max-width: 600px) {
            .title { font-size: 2.2rem; }
            .menu-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

<body>

<div class="progress-bar"></div>

<div id="installOnly">
    <i class="fas fa-download"></i>
    <h1>KOPTANU Turen</h1>
    <p>Monggo dipasang Rumiyen Applikasine.</p>
    <button class="install-btn" id="installBtnInstall">PASANG SEKARANG</button>
</div>

<div id="appContent">
    <div class="title-container">
        <span class="subtitle">Management System</span>
        <h1 class="title">Turen Dashboard</h1>
        <span class="subtitle">Version 3.1</span>
    </div>

    <div class="menu-grid">
        <a href="#" class="menu-card clickable">
            <span class="counter">0</span>
            <div class="javanese">ꦏꦿꦶꦤꦤ</div>
            <i class="fas fa-cart-shopping"></i>
            <div class="latin">Purchasing</div>
        </a>
    </div>
</div>

<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>
    AOS.init({ duration: 800, once: true });

    function isInstalled() {
        return window.matchMedia('(display-mode: standalone)').matches;
    }

    function updateUI() {
        document.getElementById('appContent').style.display = isInstalled() ? 'flex' : 'none';
        document.getElementById('installOnly').style.display = isInstalled() ? 'none' : 'flex';
    }

    window.addEventListener('load', updateUI);

    document.querySelectorAll('.clickable').forEach(card => {
        card.addEventListener('click', () => {
            const counter = card.querySelector('.counter');
            counter.textContent = Number(counter.textContent) + 1;
        });
    });
</script>

</body>
</html>
